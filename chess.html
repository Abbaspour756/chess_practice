<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --void:#16110c;
  --panel:#1f180fee;
  --panel-solid:#1f180f;
  --panel-raised:#271e13;
  --line:#3a2d1c;
  --ivory:#ecdfc4;
  --ivory-dim:#b7a98a;
  --ivory-faint:#8a7e64;
  --board-light:#e9d9b5;
  --board-dark:#83593a;
  --board-dark-shadow:#5c3b24;
  --brass:#c9a24b;
  --brass-bright:#e0bd6c;
  --brass-dim:#8c6e30;
  --ember:#b3452f;
  --ember-bright:#d15c3f;
  --sage:#7d9471;
  --radius-sm:6px;
  --radius-md:12px;
  --radius-lg:20px;
  --serif:'Fraunces', serif;
  --sans:'Inter', sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 1200px 800px at 20% -10%, #2a1e10 0%, transparent 60%),
    radial-gradient(ellipse 1000px 700px at 100% 110%, #201608 0%, transparent 55%),
    var(--void);
  color:var(--ivory);
  font-family:var(--sans);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
  overflow-x:hidden;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

button{font-family:inherit; cursor:pointer;}
.hidden{display:none !important;}

.brass-rule{
  height:1px;
  background:linear-gradient(90deg, transparent, var(--brass-dim) 20%, var(--brass-dim) 80%, transparent);
  margin:18px 0;
}

#setup-screen{
  width:100%;
  max-width:560px;
  animation:fadeUp .7s ease both;
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

.setup-card{
  background:linear-gradient(180deg, var(--panel-raised), var(--panel-solid));
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:40px 36px 34px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
}
.setup-card::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 40px);
  pointer-events:none;
}

.crest{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:6px;
}
.crest-glyph{
  font-size:44px;
  line-height:1;
  color:var(--brass-bright);
  text-shadow:0 0 24px rgba(201,162,75,.35);
}
h1.title{
  font-family:var(--serif);
  font-optical-sizing:auto;
  font-weight:600;
  font-size:42px;
  text-align:center;
  margin:0 0 4px;
  letter-spacing:.5px;
  color:var(--ivory);
}
p.subtitle{
  text-align:center;
  margin:0 0 30px;
  color:var(--ivory-faint);
  font-size:14.5px;
  line-height:1.9;
}

.field-label{
  font-size:13px;
  color:var(--brass-bright);
  margin-bottom:12px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.field-label .num{
  width:20px;height:20px;
  border:1px solid var(--brass-dim);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  color:var(--brass-dim);
  flex:none;
}

.choice-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:26px;
}
.choice-btn{
  background:#171009;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 8px 12px;
  color:var(--ivory-dim);
  text-align:center;
  transition:border-color .2s ease, background .2s ease, transform .15s ease, color .2s ease;
}
.choice-btn .cb-title{
  display:block;
  font-weight:600;
  font-size:14.5px;
  margin-bottom:3px;
}
.choice-btn .cb-sub{
  display:block;
  font-size:11.5px;
  color:var(--ivory-faint);
}
.choice-btn:hover{border-color:var(--brass-dim); transform:translateY(-1px);}
.choice-btn.active{
  background:linear-gradient(180deg, #2a2013, #1c1509);
  border-color:var(--brass);
  color:var(--ivory);
  box-shadow:0 0 0 1px var(--brass) inset, 0 8px 18px -8px rgba(201,162,75,.35);
}
.choice-btn.active .cb-sub{color:var(--brass-bright);}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:8px;
}
.color-btn{
  background:#171009;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:18px 8px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:border-color .2s ease, transform .15s ease, background .2s ease;
}
.color-btn:hover{transform:translateY(-1px); border-color:var(--brass-dim);}
.color-btn.active{
  border-color:var(--brass);
  background:linear-gradient(180deg, #2a2013, #1c1509);
  box-shadow:0 0 0 1px var(--brass) inset, 0 8px 18px -8px rgba(201,162,75,.35);
}
.color-glyph{font-size:34px; line-height:1;}
.color-glyph.white-glyph{color:#f1e9d2; text-shadow:0 0 10px rgba(241,233,210,.25);}
.color-glyph.black-glyph{color:#1a1410; -webkit-text-stroke:1px #c9a24b;}
.color-glyph.random-glyph{color:var(--brass);}
.color-name{font-size:12.5px; color:var(--ivory-dim); font-weight:600;}

.start-btn{
  width:100%;
  margin-top:10px;
  padding:16px;
  border-radius:var(--radius-md);
  border:1px solid var(--brass);
  background:linear-gradient(180deg, var(--brass-bright), var(--brass));
  color:#1c1408;
  font-weight:700;
  font-size:16px;
  letter-spacing:.3px;
  transition:filter .2s ease, transform .15s ease;
  box-shadow:0 14px 30px -12px rgba(201,162,75,.55);
}
.start-btn:hover{filter:brightness(1.07);}
.start-btn:active{transform:scale(.985);}

#game-screen{
  width:100%;
  max-width:960px;
  display:flex;
  gap:26px;
  align-items:flex-start;
  flex-wrap:wrap;
  justify-content:center;
  animation:fadeUp .5s ease both;
}

.board-wrap{
  background:linear-gradient(180deg, #241a0e, #1a130a);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.75);
  flex:none;
}

.board-frame{
  position:relative;
}

.coords-top, .coords-bottom{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  padding:0 4px;
}
.coords-top{margin-bottom:5px;}
.coords-bottom{margin-top:5px;}
.coords-top span, .coords-bottom span{
  text-align:center;
  font-size:11px;
  color:var(--ivory-faint);
  font-weight:600;
}

.board-mid{
  display:flex;
  align-items:stretch;
}
.coords-left, .coords-right{
  display:grid;
  grid-template-rows:repeat(8,1fr);
  width:16px;
}
.coords-left span, .coords-right span{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:var(--ivory-faint);
  font-weight:600;
}

#board{
  display:grid;
  grid-template-columns:repeat(8, minmax(38px,58px));
  grid-template-rows:repeat(8, minmax(38px,58px));
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 0 0 3px #120d07, 0 0 0 4px var(--brass-dim);
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}
.square.light{background:var(--board-light);}
.square.dark{background:linear-gradient(160deg, var(--board-dark), var(--board-dark-shadow));}

.square .piece{
  font-size:min(6.4vw, 40px);
  line-height:1;
  cursor:pointer;
  transition:transform .12s ease;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}
.square .piece.white-piece{color:#f7f0dc; -webkit-text-stroke:.5px #7a5a2e;}
.square .piece.black-piece{color:#1c140c; -webkit-text-stroke:.5px #0a0704;}
.square .piece:hover{transform:scale(1.08);}
.square.no-interact .piece{cursor:default;}

.square.selected::before{
  content:"";
  position:absolute; inset:0;
  background:rgba(201,162,75,.45);
  box-shadow:inset 0 0 0 2px var(--brass-bright);
}
.square.last-from::before, .square.last-to::before{
  content:"";
  position:absolute; inset:0;
  background:rgba(201,162,75,.22);
}
.square.in-check::after{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(circle, rgba(179,69,47,.75) 0%, rgba(179,69,47,0) 72%);
}
.square.move-dot::before{
  content:"";
  position:absolute;
  width:26%; height:26%;
  border-radius:50%;
  background:rgba(28,20,10,.4);
}
.square.capture-dot::before{
  content:"";
  position:absolute; inset:6%;
  border-radius:50%;
  border:4px solid rgba(179,69,47,.65);
  background:transparent;
}
.square.move-dot, .square.capture-dot{cursor:pointer;}

@keyframes popIn{
  from{transform:scale(.55); opacity:0;}
  to{transform:scale(1); opacity:1;}
}
.piece.just-moved{animation:popIn .18s ease;}

.side-panel{
  width:300px;
  flex:none;
  display:flex;
  flex-direction:column;
  gap:14px;
}
@media (max-width:760px){
  .side-panel{width:100%; max-width:520px;}
  #board{grid-template-columns:repeat(8, minmax(30px,48px)); grid-template-rows:repeat(8, minmax(30px,48px));}
}

.panel-box{
  background:linear-gradient(180deg, var(--panel-raised), var(--panel-solid));
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 18px;
}

.status-row{
  display:flex;
  align-items:center;
  gap:12px;
}
.turn-dot{
  width:14px;height:14px;
  border-radius:50%;
  flex:none;
  background:#f1e9d2;
  box-shadow:0 0 0 2px #120d07, 0 0 10px rgba(241,233,210,.5);
  transition:background .2s ease;
}
.turn-dot.black-turn{background:#1a1410; box-shadow:0 0 0 2px #120d07, 0 0 10px rgba(0,0,0,.4);}
.status-text{
  font-size:14.5px;
  font-weight:600;
  color:var(--ivory);
}
.status-sub{
  font-size:12px;
  color:var(--ivory-faint);
  margin-top:3px;
}
.thinking-dots span{
  display:inline-block;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--brass);
  margin-left:2px;
  animation:blink 1.1s infinite ease-in-out;
}
.thinking-dots span:nth-child(2){animation-delay:.15s;}
.thinking-dots span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,80%,100%{opacity:.2;} 40%{opacity:1;}}

.meta-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--ivory-faint);
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}
.meta-row b{color:var(--brass-bright); font-weight:600;}

.captured-row{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  min-height:26px;
  font-size:19px;
  line-height:1;
}
.captured-row.white-caps span{color:#f1e9d2;}
.captured-row.black-caps span{color:#443421; -webkit-text-stroke:.4px #c9a24b;}
.captured-label{font-size:11.5px; color:var(--ivory-faint); margin-bottom:6px;}

.moves-box{
  max-height:190px;
  overflow-y:auto;
}
.moves-box::-webkit-scrollbar{width:6px;}
.moves-box::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.move-line{
  display:grid;
  grid-template-columns:24px 1fr 1fr;
  gap:6px;
  padding:3px 2px;
  font-size:13px;
  color:var(--ivory-dim);
  border-radius:4px;
}
.move-line:hover{background:rgba(255,255,255,.03);}
.move-line .mn{color:var(--ivory-faint);}
.moves-empty{font-size:12.5px; color:var(--ivory-faint); padding:4px 2px;}

.action-btns{
  display:flex;
  gap:8px;
}
.ghost-btn{
  flex:1;
  padding:10px 6px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:#171009;
  color:var(--ivory-dim);
  font-size:12.5px;
  font-weight:600;
  transition:border-color .2s ease, color .2s ease;
}
.ghost-btn:hover:not(:disabled){border-color:var(--brass-dim); color:var(--ivory);}
.ghost-btn:disabled{opacity:.4; cursor:default;}

.gameover-banner{
  border:1px solid var(--brass);
  background:linear-gradient(180deg,#2a2013,#1c1509);
  border-radius:var(--radius-md);
  padding:16px 18px;
  text-align:center;
}
.gameover-banner .go-title{
  font-family:var(--serif);
  font-size:21px;
  font-weight:600;
  color:var(--brass-bright);
  margin-bottom:4px;
}
.gameover-banner .go-sub{font-size:12.5px; color:var(--ivory-faint);}

#promo-overlay{
  position:fixed; inset:0;
  background:rgba(10,7,4,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.promo-card{
  background:var(--panel-raised);
  border:1px solid var(--brass);
  border-radius:var(--radius-md);
  padding:22px 24px;
  text-align:center;
}
.promo-card p{font-size:13.5px; color:var(--ivory-dim); margin:0 0 14px;}
.promo-choices{display:flex; gap:10px;}
.promo-choices button{
  width:54px;height:54px;
  font-size:32px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:#171009;
}
.promo-choices button:hover{border-color:var(--brass);}
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-card">
    <div class="crest"><span class="crest-glyph">♞</span></div>
    <h1 class="title">Chess</h1>
    <p class="subtitle">Pick an opponent strength, choose the color<br>you'll play, and start the game.</p>

    <div class="field-label"><span class="num">1</span> Opponent difficulty</div>
    <div class="choice-row" id="difficulty-row">
      <button class="choice-btn" data-diff="easy">
        <span class="cb-title">Easy</span>
        <span class="cb-sub">Good for beginners</span>
      </button>
      <button class="choice-btn active" data-diff="medium">
        <span class="cb-title">Medium</span>
        <span class="cb-sub">A fair challenge</span>
      </button>
      <button class="choice-btn" data-diff="hard">
        <span class="cb-title">Hard</span>
        <span class="cb-sub">Thinks ahead, plays tough</span>
      </button>
    </div>

    <div class="field-label"><span class="num">2</span> Your piece color</div>
    <div class="color-row" id="color-row">
      <button class="color-btn active" data-color="w">
        <span class="color-glyph white-glyph">♔</span>
        <span class="color-name">White</span>
      </button>
      <button class="color-btn" data-color="b">
        <span class="color-glyph black-glyph">♚</span>
        <span class="color-name">Black</span>
      </button>
      <button class="color-btn" data-color="random">
        <span class="color-glyph random-glyph">?</span>
        <span class="color-name">Random</span>
      </button>
    </div>

    <button class="start-btn" id="start-btn">Start game</button>
  </div>
</div>

<div id="game-screen" class="hidden">

  <div class="board-wrap">
    <div class="board-frame">
      <div class="coords-top" id="coords-top"></div>
      <div class="board-mid">
        <div class="coords-left" id="coords-left"></div>
        <div id="board"></div>
        <div class="coords-right" id="coords-right"></div>
      </div>
      <div class="coords-bottom" id="coords-bottom"></div>
    </div>
  </div>

  <div class="side-panel">

    <div class="panel-box" id="status-box">
      <div class="status-row">
        <div class="turn-dot" id="turn-dot"></div>
        <div>
          <div class="status-text" id="status-text">Your move</div>
          <div class="status-sub" id="status-sub">Select a piece</div>
        </div>
      </div>
      <div class="meta-row">
        <span>Level: <b id="meta-diff">Medium</b></span>
        <span>You play: <b id="meta-color">White</b></span>
      </div>
    </div>

    <div class="panel-box">
      <div class="captured-label">Captured by you</div>
      <div class="captured-row white-caps" id="caps-player"></div>
      <div class="brass-rule" style="margin:12px 0;"></div>
      <div class="captured-label">Captured by opponent</div>
      <div class="captured-row black-caps" id="caps-bot"></div>
    </div>

    <div class="panel-box">
      <div class="captured-label" style="margin-bottom:8px;">Move history</div>
      <div class="moves-box" id="moves-box">
        <div class="moves-empty">No moves yet</div>
      </div>
    </div>

    <div id="gameover-slot"></div>

    <div class="action-btns">
      <button class="ghost-btn" id="undo-btn">Undo move</button>
      <button class="ghost-btn" id="flip-btn">Flip board</button>
      <button class="ghost-btn" id="newgame-btn">New game</button>
    </div>

  </div>
</div>

<div id="promo-overlay" class="hidden">
  <div class="promo-card">
    <p>Promote your pawn to:</p>
    <div class="promo-choices" id="promo-choices"></div>
  </div>
</div>

<script>
(function(){

let game = new Chess();
let difficulty = 'medium';
let playerColor = 'w';
let orientation = 'w';
let selectedSquare = null;
let legalTargets = [];
let lastMove = null;
let thinking = false;
let capturedByPlayer = [];
let capturedByBot = [];
let pendingPromotion = null;

const PIECE_UNICODE = {
  w:{p:'♙', n:'♘', b:'♗', r:'♖', q:'♕', k:'♔'},
  b:{p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚'}
};

const DIFF_LABEL = {easy:'Easy', medium:'Medium', hard:'Hard'};
const DEPTH_BY_DIFF = {easy:1, medium:2, hard:3};

const diffRow = document.getElementById('difficulty-row');
diffRow.addEventListener('click', (e)=>{
  const btn = e.target.closest('.choice-btn');
  if(!btn) return;
  diffRow.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  difficulty = btn.dataset.diff;
});

const colorRow = document.getElementById('color-row');
let colorChoice = 'w';
colorRow.addEventListener('click', (e)=>{
  const btn = e.target.closest('.color-btn');
  if(!btn) return;
  colorRow.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  colorChoice = btn.dataset.color;
});

document.getElementById('start-btn').addEventListener('click', ()=>{
  playerColor = colorChoice === 'random' ? (Math.random()<0.5?'w':'b') : colorChoice;
  orientation = playerColor;
  startGame();
});

function startGame(){
  game = new Chess();
  selectedSquare = null;
  legalTargets = [];
  lastMove = null;
  thinking = false;
  capturedByPlayer = [];
  capturedByBot = [];

  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('meta-diff').textContent = DIFF_LABEL[difficulty];
  document.getElementById('meta-color').textContent = playerColor==='w' ? 'White' : 'Black';
  document.getElementById('gameover-slot').innerHTML = '';

  buildCoords();
  renderBoard();
  updateStatus();
  updateCaptured();
  updateMovesList();

  if(game.turn() !== playerColor){
    scheduleBotMove();
  }
}

document.getElementById('newgame-btn').addEventListener('click', ()=>{
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
});

document.getElementById('flip-btn').addEventListener('click', ()=>{
  orientation = orientation === 'w' ? 'b' : 'w';
  buildCoords();
  renderBoard();
});

document.getElementById('undo-btn').addEventListener('click', ()=>{
  if(thinking) return;
  const history = game.history();
  if(history.length === 0) return;
  game.undo();
  if(game.turn() !== playerColor && game.history().length > 0){
    game.undo();
  }
  recomputeCapturedFromHistory();
  selectedSquare = null; legalTargets = [];
  lastMove = getLastMoveSquares();
  renderBoard();
  updateStatus();
  updateCaptured();
  updateMovesList();
  document.getElementById('gameover-slot').innerHTML = '';
});

function buildCoords(){
  const files = orientation==='w' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
  const ranks = orientation==='w' ? ['8','7','6','5','4','3','2','1'] : ['1','2','3','4','5','6','7','8'];

  document.getElementById('coords-top').innerHTML = files.map(f=>`<span>${f}</span>`).join('');
  document.getElementById('coords-bottom').innerHTML = files.map(f=>`<span>${f}</span>`).join('');
  document.getElementById('coords-left').innerHTML = ranks.map(r=>`<span>${r}</span>`).join('');
  document.getElementById('coords-right').innerHTML = ranks.map(r=>`<span>${r}</span>`).join('');
}

function squareList(){
  const files = orientation==='w' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];
  const ranks = orientation==='w' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const squares = [];
  for(const r of ranks){
    for(const f of files){
      squares.push(f+r);
    }
  }
  return squares;
}

function renderBoard(){
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const squares = squareList();
  const verboseBoard = game.board();

  function pieceAt(square){
    const file = square[0].charCodeAt(0)-97;
    const rank = parseInt(square[1],10);
    const row = 8-rank;
    return verboseBoard[row][file];
  }

  const kingInCheckSquare = getCheckedKingSquare();

  squares.forEach((sq)=>{
    const file = sq[0].charCodeAt(0)-97;
    const rank = parseInt(sq[1],10);
    const isLight = (file+rank)%2===1;

    const div = document.createElement('div');
    div.className = 'square ' + (isLight?'light':'dark');
    div.dataset.square = sq;

    if(lastMove && (sq===lastMove.from)) div.classList.add('last-from');
    if(lastMove && (sq===lastMove.to)) div.classList.add('last-to');
    if(selectedSquare===sq) div.classList.add('selected');
    if(kingInCheckSquare===sq) div.classList.add('in-check');

    const p = pieceAt(sq);
    if(p){
      const span = document.createElement('span');
      span.className = 'piece ' + (p.color==='w'?'white-piece':'black-piece');
      span.textContent = PIECE_UNICODE[p.color][p.type];
      if(lastMove && sq===lastMove.to) span.classList.add('just-moved');
      div.appendChild(span);
    }

    if(legalTargets.includes(sq)){
      div.classList.add(p ? 'capture-dot' : 'move-dot');
    }

    if(thinking || game.game_over()){
      div.classList.add('no-interact');
    } else {
      div.addEventListener('click', ()=>onSquareClick(sq));
    }

    boardEl.appendChild(div);
  });
}

function getCheckedKingSquare(){
  if(!game.in_check()) return null;
  const turnColor = game.turn();
  const board = game.board();
  for(let row=0; row<8; row++){
    for(let col=0; col<8; col++){
      const p = board[row][col];
      if(p && p.type==='k' && p.color===turnColor){
        const file = String.fromCharCode(97+col);
        const rank = 8-row;
        return file+rank;
      }
    }
  }
  return null;
}

function onSquareClick(sq){
  if(thinking || game.game_over()) return;
  if(game.turn() !== playerColor) return;

  if(selectedSquare && legalTargets.includes(sq)){
    tryPlayerMove(selectedSquare, sq);
    return;
  }

  const piece = game.get(sq);
  if(piece && piece.color === playerColor){
    selectedSquare = sq;
    const moves = game.moves({square:sq, verbose:true});
    legalTargets = moves.map(m=>m.to);
    renderBoard();
  } else {
    selectedSquare = null;
    legalTargets = [];
    renderBoard();
  }
}

function tryPlayerMove(from, to){
  const moves = game.moves({square:from, verbose:true});
  const match = moves.find(m=>m.to===to);
  if(!match) return;

  if(match.flags.includes('p')){
    pendingPromotion = {from, to};
    openPromotionModal(playerColor);
    return;
  }

  finalizeMove(from, to, null);
}

function finalizeMove(from, to, promotion){
  const moveObj = game.move({from, to, promotion: promotion || 'q'});
  if(!moveObj) return;

  if(moveObj.captured){
    capturedByPlayer.push({type:moveObj.captured, color: playerColor==='w'?'b':'w'});
  }

  selectedSquare = null;
  legalTargets = [];
  lastMove = {from, to};

  renderBoard();
  updateStatus();
  updateCaptured();
  updateMovesList();

  if(checkGameOver()) return;
  scheduleBotMove();
}

function openPromotionModal(color){
  const overlay = document.getElementById('promo-overlay');
  const choices = document.getElementById('promo-choices');
  const order = ['q','r','b','n'];
  choices.innerHTML = order.map(t=>
    `<button data-type="${t}" class="${color==='w'?'white-piece':'black-piece'}">${PIECE_UNICODE[color][t]}</button>`
  ).join('');
  overlay.classList.remove('hidden');

  choices.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      overlay.classList.add('hidden');
      const {from, to} = pendingPromotion;
      pendingPromotion = null;
      finalizeMove(from, to, btn.dataset.type);
    };
  });
}

function updateStatus(){
  const dot = document.getElementById('turn-dot');
  const text = document.getElementById('status-text');
  const sub = document.getElementById('status-sub');

  dot.classList.toggle('black-turn', game.turn()==='b');

  if(game.game_over()){
    sub.textContent = 'Game over';
    return;
  }

  const isPlayerTurn = game.turn() === playerColor;

  if(thinking){
    text.innerHTML = 'Opponent is thinking <span class="thinking-dots"><span></span><span></span><span></span></span>';
    sub.textContent = 'One moment';
    return;
  }

  text.textContent = isPlayerTurn ? 'Your move' : "Opponent's move";
  if(game.in_check() && isPlayerTurn){
    sub.textContent = 'Your king is in check!';
  } else {
    sub.textContent = isPlayerTurn ? 'Select a piece' : '';
  }
}

function updateCaptured(){
  const capsPlayerEl = document.getElementById('caps-player');
  const capsBotEl = document.getElementById('caps-bot');
  const oppColor = playerColor==='w'?'b':'w';

  capsPlayerEl.innerHTML = capturedByPlayer.length
    ? capturedByPlayer.map(p=>`<span>${PIECE_UNICODE[oppColor][p.type]}</span>`).join('')
    : '<span style="color:var(--ivory-faint); font-size:12px;">No captures yet</span>';

  capsBotEl.innerHTML = capturedByBot.length
    ? capturedByBot.map(p=>`<span>${PIECE_UNICODE[playerColor][p.type]}</span>`).join('')
    : '<span style="color:var(--ivory-faint); font-size:12px;">No captures yet</span>';
}

function updateMovesList(){
  const box = document.getElementById('moves-box');
  const history = game.history();
  if(history.length===0){
    box.innerHTML = '<div class="moves-empty">No moves yet</div>';
    return;
  }
  let html = '';
  for(let i=0;i<history.length;i+=2){
    const num = (i/2)+1;
    const whiteMove = history[i] || '';
    const blackMove = history[i+1] || '';
    html += `<div class="move-line"><span class="mn">${num}.</span><span>${whiteMove}</span><span>${blackMove}</span></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function recomputeCapturedFromHistory(){
  capturedByPlayer = [];
  capturedByBot = [];
  const verbose = game.history({verbose:true});
  verbose.forEach(m=>{
    if(m.captured){
      if(m.color === playerColor){
        capturedByPlayer.push({type:m.captured, color: playerColor==='w'?'b':'w'});
      } else {
        capturedByBot.push({type:m.captured, color: playerColor});
      }
    }
  });
}

function getLastMoveSquares(){
  const v = game.history({verbose:true});
  if(v.length===0) return null;
  const last = v[v.length-1];
  return {from:last.from, to:last.to};
}

function checkGameOver(){
  if(!game.game_over()) return false;

  let title = '';
  let sub = '';

  if(game.in_checkmate()){
    const winnerIsPlayer = game.turn() !== playerColor;
    title = winnerIsPlayer ? 'You win 🎉' : 'You lost';
    sub = winnerIsPlayer ? 'Checkmate — you defeated the opponent.' : 'Your king was checkmated.';
  } else if(game.in_stalemate()){
    title = 'Draw'; sub = 'The game ended in stalemate.';
  } else if(game.in_threefold_repetition()){
    title = 'Draw'; sub = 'Threefold repetition of the position.';
  } else if(game.insufficient_material()){
    title = 'Draw'; sub = 'Not enough material remains to checkmate.';
  } else if(game.in_draw()){
    title = 'Draw'; sub = 'Draw by the fifty-move rule.';
  }

  document.getElementById('gameover-slot').innerHTML = `
    <div class="gameover-banner">
      <div class="go-title">${title}</div>
      <div class="go-sub">${sub}</div>
    </div>`;
  updateStatus();
  renderBoard();
  return true;
}

const PIECE_VALUE = {p:100, n:320, b:330, r:500, q:900, k:20000};

const PST_PAWN = [
 [0,0,0,0,0,0,0,0],
 [50,50,50,50,50,50,50,50],
 [10,10,20,30,30,20,10,10],
 [5,5,10,25,25,10,5,5],
 [0,0,0,20,20,0,0,0],
 [5,-5,-10,0,0,-10,-5,5],
 [5,10,10,-20,-20,10,10,5],
 [0,0,0,0,0,0,0,0]
];
const PST_KNIGHT = [
 [-50,-40,-30,-30,-30,-30,-40,-50],
 [-40,-20,0,0,0,0,-20,-40],
 [-30,0,10,15,15,10,0,-30],
 [-30,5,15,20,20,15,5,-30],
 [-30,0,15,20,20,15,0,-30],
 [-30,5,10,15,15,10,5,-30],
 [-40,-20,0,5,5,0,-20,-40],
 [-50,-40,-30,-30,-30,-30,-40,-50]
];
const PST_BISHOP = [
 [-20,-10,-10,-10,-10,-10,-10,-20],
 [-10,0,0,0,0,0,0,-10],
 [-10,0,5,10,10,5,0,-10],
 [-10,5,5,10,10,5,5,-10],
 [-10,0,10,10,10,10,0,-10],
 [-10,10,10,10,10,10,10,-10],
 [-10,5,0,0,0,0,5,-10],
 [-20,-10,-10,-10,-10,-10,-10,-20]
];
const PST_ROOK = [
 [0,0,0,0,0,0,0,0],
 [5,10,10,10,10,10,10,5],
 [-5,0,0,0,0,0,0,-5],
 [-5,0,0,0,0,0,0,-5],
 [-5,0,0,0,0,0,0,-5],
 [-5,0,0,0,0,0,0,-5],
 [-5,0,0,0,0,0,0,-5],
 [0,0,0,5,5,0,0,0]
];
const PST_QUEEN = [
 [-20,-10,-10,-5,-5,-10,-10,-20],
 [-10,0,0,0,0,0,0,-10],
 [-10,0,5,5,5,5,0,-10],
 [-5,0,5,5,5,5,0,-5],
 [0,0,5,5,5,5,0,-5],
 [-10,5,5,5,5,5,0,-10],
 [-10,0,5,0,0,0,0,-10],
 [-20,-10,-10,-5,-5,-10,-10,-20]
];
const PST_KING = [
 [-30,-40,-40,-50,-50,-40,-40,-30],
 [-30,-40,-40,-50,-50,-40,-40,-30],
 [-30,-40,-40,-50,-50,-40,-40,-30],
 [-30,-40,-40,-50,-50,-40,-40,-30],
 [-20,-30,-30,-40,-40,-30,-30,-20],
 [-10,-20,-20,-20,-20,-20,-20,-10],
 [20,20,0,0,0,0,20,20],
 [20,30,10,0,0,10,30,20]
];
const PST_MAP = {p:PST_PAWN, n:PST_KNIGHT, b:PST_BISHOP, r:PST_ROOK, q:PST_QUEEN, k:PST_KING};

function evaluateBoard(g){
  if(g.in_checkmate()){
    return g.turn()==='w' ? -99000 : 99000;
  }
  if(g.in_draw() || g.in_stalemate() || g.in_threefold_repetition()){
    return 0;
  }
  const board = g.board();
  let score = 0;
  for(let row=0; row<8; row++){
    for(let col=0; col<8; col++){
      const p = board[row][col];
      if(!p) continue;
      const value = PIECE_VALUE[p.type];
      const pst = PST_MAP[p.type];
      const posBonus = p.color==='w' ? pst[row][col] : pst[7-row][col];
      score += (p.color==='w' ? 1 : -1) * (value + posBonus);
    }
  }
  return score;
}

function orderMoves(moves){
  return moves.slice().sort((a,b)=>{
    const av = a.captured ? PIECE_VALUE[a.captured] : 0;
    const bv = b.captured ? PIECE_VALUE[b.captured] : 0;
    return bv-av;
  });
}

function minimax(g, depth, alpha, beta, maximizing){
  if(depth===0 || g.game_over()){
    return evaluateBoard(g);
  }
  const moves = orderMoves(g.moves({verbose:true}));

  if(maximizing){
    let best = -Infinity;
    for(const m of moves){
      g.move({from:m.from, to:m.to, promotion:m.promotion || 'q'});
      const val = minimax(g, depth-1, alpha, beta, false);
      g.undo();
      if(val>best) best=val;
      if(val>alpha) alpha=val;
      if(beta<=alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const m of moves){
      g.move({from:m.from, to:m.to, promotion:m.promotion || 'q'});
      const val = minimax(g, depth-1, alpha, beta, true);
      g.undo();
      if(val<best) best=val;
      if(val<beta) beta=val;
      if(beta<=alpha) break;
    }
    return best;
  }
}

function pickBotMove(){
  const botColor = game.turn();
  const moves = orderMoves(game.moves({verbose:true}));
  if(moves.length===0) return null;

  if(difficulty==='easy'){
    const captures = moves.filter(m=>m.captured);
    const pool = (captures.length>0 && Math.random()<0.55) ? captures : moves;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  const depth = DEPTH_BY_DIFF[difficulty];
  const botMaximizes = botColor==='w';
  let bestMoves = [];
  let bestScore = botMaximizes ? -Infinity : Infinity;

  for(const m of moves){
    game.move({from:m.from, to:m.to, promotion:m.promotion || 'q'});
    const val = minimax(game, depth-1, -Infinity, Infinity, !botMaximizes);
    game.undo();

    if(botMaximizes){
      if(val>bestScore){bestScore=val; bestMoves=[m];}
      else if(val===bestScore){bestMoves.push(m);}
    } else {
      if(val<bestScore){bestScore=val; bestMoves=[m];}
      else if(val===bestScore){bestMoves.push(m);}
    }
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

function scheduleBotMove(){
  if(game.game_over()) return;
  thinking = true;
  updateStatus();
  renderBoard();
  setTimeout(()=>{
    const move = pickBotMove();
    thinking = false;
    if(!move){ updateStatus(); return; }

    const moveObj = game.move({from:move.from, to:move.to, promotion:move.promotion || 'q'});
    if(moveObj.captured){
      capturedByBot.push({type:moveObj.captured, color:playerColor});
    }
    lastMove = {from:move.from, to:move.to};

    renderBoard();
    updateStatus();
    updateCaptured();
    updateMovesList();
    checkGameOver();
  }, 260);
}

})();
</script>
